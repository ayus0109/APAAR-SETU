name: Import AICTE-APAAR files to APAAR-SETU

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-aicte-apaar.yml"

permissions:
  contents: write

jobs:
  replace-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out APAAR-SETU
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace project files from AICTE-APAAR
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ayus0109/AICTE-APAAR.git /tmp/AICTE-APAAR
          rsync -a --delete --exclude='/.git/' --exclude='/.github/' /tmp/AICTE-APAAR/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to copy."
            exit 0
          fi
          git commit -m "Replace project with files from AICTE-APAAR"
          git push origin HEAD:main
