name: Import project files from SIH-2026

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-source.yml"

permissions:
  contents: write

jobs:
  copy-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out APAAR-SETU
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Copy source repository files
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ayus0109/SIH-2026.git /tmp/SIH-2026
          rsync -a --exclude='.git/' /tmp/SIH-2026/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to copy."
            exit 0
          fi
          git commit -m "Copy project files from SIH-2026"
          git push origin HEAD:main
